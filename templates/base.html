<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vending Machine{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  {% csrf_token %}
  <header class="top">
    <a class="brand" href="/">Box Vendor</a>
    <nav>
      <a href="/" class="{% block nav_customer %}{% endblock %}">Customer</a>
      <a href="/manage/" class="{% block nav_admin %}{% endblock %}">Admin</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
